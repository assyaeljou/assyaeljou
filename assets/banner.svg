<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d">
  <title id="t">assyaeljou: IT Engineer, PhD Student in Software Quality, QA and AI Engineering</title>
  <desc id="d">Dark navy banner with a subtle CI/CD pipeline motif: commit, build, test, predict, explain.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#121a33"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.12" cy="0.2" r="0.55">
      <stop offset="0" stop-color="#2f6bff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2f6bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="0.92" cy="0.85" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pipe" gradientUnits="userSpaceOnUse" x1="100" y1="0" x2="1100" y2="0">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#3b82f6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0.75"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2a3558" stroke-opacity="0.35" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect width="1200" height="320" fill="url(#glowBlue)"/>
  <rect width="1200" height="320" fill="url(#glowPurple)"/>

  <!-- Text block -->
  <g font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">
    <text x="80" y="82" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="15" fill="#4f8cff" letter-spacing="1">software quality / qa / ai engineering</text>
    <text x="80" y="146" font-size="58" font-weight="700" fill="#f0f6fc">assyaeljou</text>
    <text x="80" y="188" font-size="22" fill="#c9d1d9">IT Engineer  |  PhD Student in Software Quality  |  QA &amp; AI Engineering</text>
    <text x="80" y="218" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="15" fill="#8b949e">research: explainable AI for software quality prediction in CI/CD pipelines</text>
  </g>

  <!-- Pipeline motif -->
  <g>
    <line x1="100" y1="268" x2="1100" y2="268" stroke="url(#pipe)" stroke-width="2"/>
    <circle cx="100" cy="268" r="6" fill="#0b1220" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="350" cy="268" r="6" fill="#0b1220" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="600" cy="268" r="6" fill="#0b1220" stroke="#4f8cff" stroke-width="2"/>
    <circle cx="850" cy="268" r="6" fill="#0b1220" stroke="#7c6ff6" stroke-width="2"/>
    <circle cx="1100" cy="268" r="7" fill="#8b5cf6" stroke="#a78bfa" stroke-width="2"/>
    <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12" fill="#6e7f9d" text-anchor="middle">
      <text x="100" y="294">commit</text>
      <text x="350" y="294">build</text>
      <text x="600" y="294">test</text>
      <text x="850" y="294">predict</text>
      <text x="1100" y="294" fill="#a78bfa">explain</text>
    </g>
  </g>
</svg>
